# Configuration documentation:
#   https://embarkstudios.github.io/cargo-deny/index.html

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste crate is no longer maintained, but it is past 1.0
    # Keep this here until our transisent dependencies no longer
    # need it
    "RUSTSEC-2024-0436",
    # rustls-pemfile is unmaintained but still used as a transitive dependency
    # from object_store. We've removed our direct dependency and migrated to
    # rustls-pki-types. Remove once object_store updates.
    "RUSTSEC-2025-0134",
    # bincode is unmaintained but does not have any known issues;
    # there are multiple replacements at this time but there isn't
    # yet a clear choice
    "RUSTSEC-2025-0141",
    # quick-xml < 0.41.0 two DoS advisories: unbounded namespace-declaration
    # allocation in NsReader (0195) and quadratic-time attribute duplicate check
    # (0194). Pulled in transitively at two versions with no upgrade path yet:
    # object_store (latest 0.14.0) pins quick-xml ^0.40.1 and inferno (latest
    # 0.12.6, via pprof) pins ^0.39 — neither reaches the patched 0.41.0. Remove
    # once object_store and pprof/inferno move to quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustls-webpki 0.102.8 CRL distribution point matching bug; low impact
    # (requires CA compromise). Stuck on 0.102.x via wasmtime's rustls 0.22.x
    # dep in datafusion-udf-wasm. Upstream also ignores this advisory.
    "RUSTSEC-2026-0049",
    # rustls-webpki 0.102.8 wildcard name-constraint bug; stuck on 0.102.x via
    # wasmtime's rustls 0.22.x dep in datafusion-udf-wasm. Upstream fix pulls in
    # newer DataFusion/wasmtime and is not yet compatible with this repo.
    "RUSTSEC-2026-0099",
    # rustls-webpki 0.102.8 URI name-constraint bug; same transitive 0.102.x path
    # via datafusion-udf-wasm/wasmtime/rustls 0.22.x, with the same current
    # incompatibility on the available upstream fix path.
    "RUSTSEC-2026-0098",
    # rustls-webpki CRL parsing reachable panic; only 0.103.13+ and 0.104.0-alpha.7+
    # ship the fix. The 0.103.x transitive is patched via the Cargo.toml pin bump,
    # but the 0.102.x transitive is still stuck via datafusion-udf-wasm/wasmtime/
    # rustls 0.22.x with no patched 0.102.x release available. We don't configure
    # CRLs anywhere in this repo, so the panic is unreachable in practice on that
    # remaining 0.102.x path.
    "RUSTSEC-2026-0104",
    # rustls-webpki 0.102.8 may accept certificate paths through distrusted
    # emSign intermediates, and there is no patched 0.102.x release. After the
    # tokio-rustls 0.26 bump, only the UDF host's wasmtime-wasi-http 41.0.4
    # pulls 0.102.8, through rustls 0.22. It sends requests only from UDFs.
    # UDFs are off by default, and the UDF HTTP allow list is empty by default.
    # Its root store is webpki-roots 0.26.11, which re-exports webpki-roots 1.x,
    # and 1.0.10 drops the emSign root. Remove this entry when the UDF host
    # leaves wasmtime 41.
    "RUSTSEC-2026-0382",
    # rustls 0.22.4 advisories with no fix on the 0.22.x line. It comes in only
    # through wasmtime-wasi-http via datafusion-udf-wasm, and Wasm UDFs are
    # disabled by default (udfs_enabled = false). rustls 0.23.x is updated to
    # 0.23.46, which fixes both. main no longer has rustls 0.22.
    "RUSTSEC-2026-0346", # Debug impls for client session values expose TLS secrets
    "RUSTSEC-2026-0349", # unauthenticated ServerHello can downgrade later key exchange
    # webpki-roots 0.26.11 is the last 0.26 release: a shim that re-exports
    # webpki-roots 1.x, which this lockfile holds at the patched 1.0.10, so the
    # distrusted emSign root is not bundled. sqlx-core 0.8 pins the 0.26 line;
    # remove this entry when sqlx moves to 0.9 (webpki-roots ^1).
    "RUSTSEC-2026-0381",
    # RustSec published these Wasmtime advisories on 2026-09-29.
    # Wasmtime 48.0.3 and later fix them, but 3.11 uses 41.0.4, and there is no patched 41.x release.
    # The UDF host (datafusion-udf-wasm 89ab4ae) uses 41.0.4.
    # The datafusion-udf-wasm revisions that use Wasmtime 48 need DataFusion 52, and 3.11 uses DataFusion 51.
    # RUSTSEC-2026-0315 does not affect versions below 47.0.0, so it is not listed.
    # UDFs are off by default.
    # 0313: The UDF Python guest (datafusion-udf-wasm commit 89ab4ae) gives Python code only `blocking_write_and_flush` for HTTP bodies, and the host rejects calls over 4096 bytes.
    # 0314: The UDF host's file system rejects time changes.
    # 0316: The UDF host does not use `component::Val`.
    # Remove these entries after the UDF host uses Wasmtime 48.0.3 or later.
    "RUSTSEC-2026-0313",
    "RUSTSEC-2026-0314",
    "RUSTSEC-2026-0316",
    # RustSec published these Wasmtime advisories on 2026-10-02.
    # Wasmtime 48.0.4 and later fix them, but 3.11 uses 41.0.4, and there is no patched 41.x release.
    # The reasons for staying on 41.0.4 are the same as for the entries above.
    # RUSTSEC-2026-0320 and RUSTSEC-2026-0324 do not affect versions below 46.0.0, and RUSTSEC-2026-0325 and RUSTSEC-2026-0326 do not affect versions below 47.0.0, so they are not listed.
    # UDFs are off by default.
    # 0321: The UDF host does not turn on the wasmtime-wasi `p0` Cargo feature and does not turn on fuel.
    # 0322: The UDF host does not set stdout, so wasmtime uses its sink stream, which has the bug. But the Python guest does not import `write-zeroes` or `blocking-write-zeroes-and-flush`, so it cannot reach it.
    # 0323: The UDF host does not turn on the wasmtime-wasi `p1` Cargo feature, which holds `fd_readdir`. The Python guest imports only WASI 0.2 interfaces.
    # 0327: The UDF host does not turn on the wasmtime `component-model-async` Cargo feature, so it rejects async components. The Python guest has no async-lifted export.
    # Remove these entries after the UDF host uses Wasmtime 48.0.4 or later.
    "RUSTSEC-2026-0321",
    "RUSTSEC-2026-0322",
    "RUSTSEC-2026-0323",
    "RUSTSEC-2026-0327",
    # RustSec published these Wasmtime advisories on 2026-10-14.
    # Wasmtime 48.0.6 and later fix them, but 3.11 uses 41.0.4, and there is no patched 41.x release.
    # The reasons for staying on 41.0.4 are the same as for the entries above.
    # The other advisories from RUSTSEC-2026-0350 to RUSTSEC-2026-0364 do not affect versions below 42.0.0, so they are not listed.
    # UDFs are off by default.
    # 0350: The UDF host checks only the authority before it sends a request through wasmtime's default sender. This is reachable only if an operator turns on UDFs and allows a forward proxy that honors absolute-form targets. The UDF HTTP allow list is empty by default.
    # 0352: The UDF host's file system rejects `rename_at` and `symlink_at`.
    # 0363: Python UDF code cannot define component resources or instantiate sub-components; the component graph is fixed by our guest build.
    # Remove these entries after the UDF host uses Wasmtime 48.0.6 or later.
    "RUSTSEC-2026-0350",
    "RUSTSEC-2026-0352",
    "RUSTSEC-2026-0363",
    # RustSec published these Wasmtime advisories on 2026-10-19.
    # Wasmtime 48.0.7 and later fix them, but 3.11 uses 41.0.4, and there is no patched 41.x release.
    # The reasons for staying on 41.0.4 are the same as for the entries above.
    # RUSTSEC-2026-0375, 0377 and 0378 do not affect versions below 46.0.0, so they are not listed.
    # UDFs are off by default.
    # 0376: Python UDF code can add a second `content-length` header to a request. This is reachable only if an operator turns on UDFs and adds a host to the UDF HTTP allow list. The allow list is empty by default.
    # 0379 and 0380: These Cranelift bugs need a crafted or very large Wasm module. The UDF host does not compile Wasm at run time, because its copy of wasmtime does not turn on the `cranelift` Cargo feature.
    # 0379 and 0380: The UDF host loads the precompiled Python guest from a datafusion-udf-wasm release, and the build checks its SHA-256. Python UDF code runs inside that guest and cannot supply its own Wasm module.
    # Remove these entries after the UDF host uses Wasmtime 48.0.7 or later.
    "RUSTSEC-2026-0376",
    "RUSTSEC-2026-0379",
    "RUSTSEC-2026-0380",

    # wasmtime 41.0.4 advisories (transitive dep via datafusion-udf-wasm)
    #
    # Wasm UDFs are disabled by default (udfs_enabled = false in iox_query config).
    # The Wasm component model code path is never entered unless explicitly enabled.
    # Additionally, none of the advisories match our runtime configuration:
    #
    # Winch compiler backend required (we use Cranelift, the default):
    "RUSTSEC-2026-0086", # GHSA-m9w2-8782-2946: host data leakage with 64-bit tables and Winch
    "RUSTSEC-2026-0089", # GHSA-q49f-xg75-m9xw: host panic on table.fill with Winch
    "RUSTSEC-2026-0094", # GHSA-f984-pcp8-v2p7: improperly masked table.grow return with Winch
    "RUSTSEC-2026-0095", # GHSA-xx5w-cvp6-jv83: Winch sandbox-escaping memory access
    #
    # Non-default runtime config required (we use defaults: spectre on, on-demand allocator):
    "RUSTSEC-2026-0087", # GHSA-qqfj-4vcm-26hv: f64x2.splat segfault (requires signals-based-traps disabled)
    "RUSTSEC-2026-0088", # GHSA-6wgr-89rj-399p: pooling allocator data leakage (requires pooling allocator)
    "RUSTSEC-2026-0096", # GHSA-jhxm-h53p-jm7w: aarch64 sandbox escape (requires spectre mitigations disabled)
    #
    # Component model features we don't use (no flags types, no cross-component string passing):
    "RUSTSEC-2026-0085", # GHSA-m758-wjhj-p3jq: panic lifting flags component value (no flags in our WIT)
    "RUSTSEC-2026-0092", # GHSA-jxhv-7h78-9775: panic on misaligned UTF-16 strings (cross-component only)
    "RUSTSEC-2026-0093", # GHSA-hx6p-xpx3-jvvv: heap OOB read in UTF-16 transcoding (cross-component only)
    #
    # Guest realloc validation (single-component host-guest interaction; low risk given UDFs are disabled):
    "RUSTSEC-2026-0091", # GHSA-394w-hwhg-8vgm: OOB write from unvalidated guest realloc
    #
    # Guest-controllable panic (unreachable when UDFs are disabled):
    "RUSTSEC-2026-0114", # panic when allocating a wasm table exceeding host address space
    #
    # wasmtime-wasi 41.0.4 WASI path_open(TRUNCATE) bypasses FilePerms::WRITE host
    # restriction (https://rustsec.org/advisories/RUSTSEC-2026-0149). Same transitive
    # path via datafusion-udf-wasm; only reachable if a Wasm UDF is loaded with WASI
    # filesystem preopens granted, and UDFs are disabled by default
    # (udfs_enabled = false). Fix requires wasmtime-wasi >=44.0.2, which needs an
    # upstream datafusion-udf-wasm bump.
    "RUSTSEC-2026-0149",
    #
    # Another wasmtime advisory:
    "RUSTSEC-2026-0182",
    #
    # wasmtime-wasi 41.0.4 WASI hard links and renames bypass FilePerms for the
    # destination (https://rustsec.org/advisories/RUSTSEC-2026-0188). Same transitive
    # path via datafusion-udf-wasm; only reachable if a Wasm UDF is loaded with WASI
    # filesystem preopens granted, and UDFs are disabled by default
    # (udfs_enabled = false). Fix requires wasmtime-wasi >=45.0.3, which needs an
    # upstream datafusion-udf-wasm bump.
    "RUSTSEC-2026-0188",
    #
    # wasmtime 41.0.4 stores can mix up type indices between engines
    # (https://rustsec.org/advisories/RUSTSEC-2026-0222). Same transitive path via
    # datafusion-udf-wasm; only reachable if a Wasm UDF is loaded, and UDFs are
    # disabled by default (udfs_enabled = false). The 41.x line has no patched
    # release. The fix requires wasmtime >=46.0.2, which needs an upstream
    # datafusion-udf-wasm bump to a DataFusion 52 rev.
    "RUSTSEC-2026-0222",
    #
    # wasmtime 41.0.4 filesystem sandbox escape when paths or symlinks contain
    # trailing slashes (https://rustsec.org/advisories/RUSTSEC-2026-0269). Same
    # transitive path via datafusion-udf-wasm; only reachable if a Wasm UDF is
    # loaded with WASI filesystem preopens granted, and UDFs are disabled by
    # default (udfs_enabled = false). The 41.x line has no patched release. The
    # fix requires wasmtime >=46.0.3, which needs an upstream datafusion-udf-wasm
    # bump.
    "RUSTSEC-2026-0269",
    #
    # TODO: update wasmtime-wasi via datafusion-udf-wasm to a patched version (>=45.0.3; >=46.0.1 is also fixed)
    # zstd 0.13 advisories with no fix on the 0.13 line. The fixed zstd 0.14.3
    # and zstd-safe 8.2.0 are only accepted by arrow-ipc and parquet 60, so
    # moving to them is an arrow and DataFusion upgrade. Until then:
    # - RUSTSEC-2026-0391: `with_context` carries an abandoned stream's buffers
    #   into the next stream. Nothing in the graph calls `with_context`.
    # - RUSTSEC-2026-0398: `Seekable::decompress` is behind the `seekable`
    #   feature, which nothing enables, so the code is not compiled.
    # - RUSTSEC-2026-0403: a corrupt legacy frame leaks stale heap through
    #   `zstd::stream::write::Decoder`. Nothing uses the write-side decoder:
    #   our code calls `decode_all`, tonic, arrow-ipc and parquet use the
    #   read-side and bulk decoders, and compression-codecs (DataFusion's file
    #   decompression) decodes into a caller-provided slice, not a `Vec`.
    "RUSTSEC-2026-0391", # https://rustsec.org/advisories/RUSTSEC-2026-0391
    "RUSTSEC-2026-0398", # https://rustsec.org/advisories/RUSTSEC-2026-0398
    "RUSTSEC-2026-0403", # https://rustsec.org/advisories/RUSTSEC-2026-0403
]
git-fetch-with-cli = true

[licenses]
version = 2
unused-allowed-license = "warn"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "BSD-4-Clause AND ISC AND MIT AND OpenSSL"
license-files = [
    # https://github.com/briansmith/ring/blob/95948b3977013aed16db92ae32e6b8384496a740/LICENSE
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[sources.allow-org]
github = ["influxdata"]

[bans]
multiple-versions = "allow"
deny = [
    # We are using rustls as the TLS implementation, so we shouldn't be linking
    # in OpenSSL too.
    #
    # If you're hitting this, you might want to take a look at what new
    # dependencies you have introduced and check if there's a way to depend on
    # rustls instead of OpenSSL (tip: check the crate's feature flags).
    { name = "openssl-sys" },
    # We've decided to use the `humantime` crate to parse and generate friendly time formats; use
    # that rather than chrono-english.
    { name = "chrono-english" },
    # Use stdlib ( https://doc.rust-lang.org/stable/std/io/trait.IsTerminal.html )
    { name = "atty" },
]
