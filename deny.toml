# Configuration documentation:
#   https://embarkstudios.github.io/cargo-deny/index.html

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste crate is no longer maintained, but it is past 1.0
    # Keep this here until our transisent dependencies no longer
    # need it
    "RUSTSEC-2024-0436", # https://rustsec.org/advisories/RUSTSEC-2024-0436
    # rustls-pemfile is unmaintained but still used as a transitive dependency
    # from object_store. We've removed our direct dependency and migrated to
    # rustls-pki-types. Remove once object_store updates.
    "RUSTSEC-2025-0134", # https://rustsec.org/advisories/RUSTSEC-2025-0134
    # bincode is unmaintained but does not have any known issues;
    # there are multiple replacements at this time but there isn't
    # yet a clear choice
    "RUSTSEC-2025-0141", # https://rustsec.org/advisories/RUSTSEC-2025-0141
    # quick-xml < 0.41.0 two DoS advisories: unbounded namespace-declaration
    # allocation in NsReader (0195) and quadratic-time attribute duplicate check
    # (0194). Pulled in transitively at two versions with no upgrade path yet:
    # object_store (latest 0.14.0) pins quick-xml ^0.40.1 and inferno (latest
    # 0.12.6, via pprof) pins ^0.39 — neither reaches the patched 0.41.0. Remove
    # once object_store and pprof/inferno move to quick-xml >= 0.41.
    "RUSTSEC-2026-0194", # https://rustsec.org/advisories/RUSTSEC-2026-0194
    "RUSTSEC-2026-0195", # https://rustsec.org/advisories/RUSTSEC-2026-0195
    # rustls-webpki 0.102.8 CRL distribution point matching bug; low impact
    # (requires CA compromise). Stuck on 0.102.x via wasmtime's rustls 0.22.x
    # dep in datafusion-udf-wasm. Upstream also ignores this advisory.
    "RUSTSEC-2026-0049", # https://rustsec.org/advisories/RUSTSEC-2026-0049
    # rustls-webpki 0.102.8 wildcard name-constraint bug; stuck on 0.102.x via
    # wasmtime's rustls 0.22.x dep in datafusion-udf-wasm. Upstream fix pulls in
    # newer DataFusion/wasmtime and is not yet compatible with this repo.
    "RUSTSEC-2026-0099", # https://rustsec.org/advisories/RUSTSEC-2026-0099
    # rustls-webpki 0.102.8 URI name-constraint bug; same transitive 0.102.x path
    # via datafusion-udf-wasm/wasmtime/rustls 0.22.x, with the same current
    # incompatibility on the available upstream fix path.
    "RUSTSEC-2026-0098", # https://rustsec.org/advisories/RUSTSEC-2026-0098
    # rustls-webpki CRL parsing reachable panic; only 0.103.13+ and 0.104.0-alpha.7+
    # ship the fix. The 0.103.x transitive is patched via the Cargo.toml pin bump,
    # but the 0.102.x transitive is still stuck via datafusion-udf-wasm/wasmtime/
    # rustls 0.22.x with no patched 0.102.x release available. We don't configure
    # CRLs anywhere in this repo, so the panic is unreachable in practice on that
    # remaining 0.102.x path.
    "RUSTSEC-2026-0104", # https://rustsec.org/advisories/RUSTSEC-2026-0104
    # rustls 0.22.4 advisories with no fix on the 0.22.x line. It comes in only
    # through wasmtime-wasi-http via datafusion-udf-wasm, and Wasm UDFs are
    # disabled by default (udfs_enabled = false). rustls 0.23.x is updated to
    # 0.23.46, which fixes both. main no longer has rustls 0.22.
    # Debug impls for client session values expose TLS secrets
    "RUSTSEC-2026-0346", # https://rustsec.org/advisories/RUSTSEC-2026-0346
    # unauthenticated ServerHello can downgrade later key exchange
    "RUSTSEC-2026-0349", # https://rustsec.org/advisories/RUSTSEC-2026-0349
    # zstd 0.13 advisories with no fix on the 0.13 line. The fixed zstd 0.14.3
    # and zstd-safe 8.2.0 are only accepted by arrow-ipc and parquet 60, so
    # moving to them is an arrow and DataFusion upgrade. Until then:
    # - RUSTSEC-2026-0391: `with_context` carries an abandoned stream's buffers
    #   into the next stream. Nothing in the graph calls `with_context`.
    # - RUSTSEC-2026-0398: `Seekable::decompress` is behind the `seekable`
    #   feature, which nothing enables, so the code is not compiled.
    # - RUSTSEC-2026-0403: a corrupt legacy frame leaks stale heap through
    #   `zstd::stream::write::Decoder`. Nothing uses the write-side decoder:
    #   our code calls `decode_all`, tonic, arrow-ipc and parquet use the
    #   read-side and bulk decoders, and compression-codecs (DataFusion's file
    #   decompression) decodes into a caller-provided slice, not a `Vec`.
    "RUSTSEC-2026-0391", # https://rustsec.org/advisories/RUSTSEC-2026-0391
    "RUSTSEC-2026-0398", # https://rustsec.org/advisories/RUSTSEC-2026-0398
    "RUSTSEC-2026-0403", # https://rustsec.org/advisories/RUSTSEC-2026-0403
    # thrift 0.17 has an unbounded read from untrusted parquet files (denial of
    # service attack). See https://rustsec.org/advisories/RUSTSEC-2026-0435. We
    # can't take arrow/parquet 58.2+ on DataFusion 53 (per comment in
    # Cargo.toml and the DataFusion 54 upgrade already in progress
    # (https://github.com/influxdata/influxdb_pro/issues/6494)); ignore for now
    "RUSTSEC-2026-0435", # https://rustsec.org/advisories/RUSTSEC-2026-0435
    # SQLite's page-cache disclosure requires opening an attacker-supplied
    # DB and sibling WAL with mismatched page sizes. Core uses SQLx only for
    # data_types' type/codec implementations, not to open databases.
    # sqlx-sqlite 0.8.6 requires libsqlite3-sys 0.30.x; even 0.9.0 requires
    # <0.38.0, excluding the fixed >=0.39.0. Remove when SQLx accepts the fix.
    "RUSTSEC-2026-0459", # https://rustsec.org/advisories/RUSTSEC-2026-0459
    # chrono, chrono-tz and humantime are unmaintained across all versions;
    # no patched upgrades exist. These are maintenance-only advisories.
    # We use chrono, chrono-tz and humantime directly, and Arrow/DataFusion also
    # require chrono and chrono-tz. Remove these exceptions when we and our
    # dependencies migrate to maintained alternatives.
    "RUSTSEC-2026-0542", # https://rustsec.org/advisories/RUSTSEC-2026-0542
    "RUSTSEC-2026-0543", # https://rustsec.org/advisories/RUSTSEC-2026-0543
    "RUSTSEC-2026-0555", # https://rustsec.org/advisories/RUSTSEC-2026-0555
    # wasmtime 50.0.1 advisories, all fixed in wasmtime 50.0.2. Each one lets a
    # WebAssembly guest make the host panic, abort or use memory without bound
    # (denial of service). The only guests we run are Python UDFs, which are
    # off unless `iox.udfs_enabled` is set. Remove these exceptions when
    # wasmtime moves to 50.0.2 or later.
    # - RUSTSEC-2026-0566: empty writes to a wasmtime-wasi `AsyncWriteStream`
    #   grow host memory without bound.
    # - RUSTSEC-2026-0567: abort when the threads proposal is enabled in a
    #   build without the `threads` feature.
    # - RUSTSEC-2026-0568: a stale GC heap base pointer lets a guest abort the
    #   host process.
    # - RUSTSEC-2026-0569: `Caller::get_module_export` panics when the host
    #   function was not called from WebAssembly.
    # - RUSTSEC-2026-0570: abort on a function subtype check in a build
    #   without the `gc` feature.
    # - RUSTSEC-2026-0571: empty wasmtime-wasi-http body writes over HTTP/2
    #   grow host memory without bound.
    # - RUSTSEC-2026-0572: panic when a component cancels a stream or future
    #   copy on the wrong end.
    # - RUSTSEC-2026-0573: abort when a GC heap that cannot move has a
    #   reservation that is not a multiple of the page size.
    "RUSTSEC-2026-0566", # https://rustsec.org/advisories/RUSTSEC-2026-0566
    "RUSTSEC-2026-0567", # https://rustsec.org/advisories/RUSTSEC-2026-0567
    "RUSTSEC-2026-0568", # https://rustsec.org/advisories/RUSTSEC-2026-0568
    "RUSTSEC-2026-0569", # https://rustsec.org/advisories/RUSTSEC-2026-0569
    "RUSTSEC-2026-0570", # https://rustsec.org/advisories/RUSTSEC-2026-0570
    "RUSTSEC-2026-0571", # https://rustsec.org/advisories/RUSTSEC-2026-0571
    "RUSTSEC-2026-0572", # https://rustsec.org/advisories/RUSTSEC-2026-0572
    "RUSTSEC-2026-0573", # https://rustsec.org/advisories/RUSTSEC-2026-0573
    # RUSTSEC-2026-0587: on Windows, a WASI guest can escape its filesystem
    # sandbox through a drive-prefixed path component. Fixed in wasmtime
    # 36.0.22, 48.0.10, 49.0.7 and 50.0.3. The only guests we run are Python
    # UDFs, which see an in-memory file system, not a host directory. Remove
    # this exception when wasmtime moves to a fixed version.
    "RUSTSEC-2026-0587", # https://rustsec.org/advisories/RUSTSEC-2026-0587
]
git-fetch-with-cli = true

[licenses]
version = 2
unused-allowed-license = "warn"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "BSD-4-Clause AND ISC AND MIT AND OpenSSL"
license-files = [
    # https://github.com/briansmith/ring/blob/95948b3977013aed16db92ae32e6b8384496a740/LICENSE
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[sources.allow-org]
github = ["influxdata"]

[bans]
multiple-versions = "allow"
deny = [
    # We are using rustls as the TLS implementation, so we shouldn't be linking
    # in OpenSSL too.
    #
    # If you're hitting this, you might want to take a look at what new
    # dependencies you have introduced and check if there's a way to depend on
    # rustls instead of OpenSSL (tip: check the crate's feature flags).
    { name = "openssl-sys" },
    # We've decided to use the `humantime` crate to parse and generate friendly time formats; use
    # that rather than chrono-english.
    { name = "chrono-english" },
    # Use stdlib ( https://doc.rust-lang.org/stable/std/io/trait.IsTerminal.html )
    { name = "atty" },
]
