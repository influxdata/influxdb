# Configuration documentation:
#   https://embarkstudios.github.io/cargo-deny/index.html

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste crate is no longer maintained, but it is past 1.0
    # Keep this here until our transisent dependencies no longer
    # need it
    "RUSTSEC-2024-0436",
    # rustls-pemfile is unmaintained but still used as a transitive dependency
    # from object_store. We've removed our direct dependency and migrated to
    # rustls-pki-types. Remove once object_store updates.
    "RUSTSEC-2025-0134",
    # bincode is unmaintained but does not have any known issues;
    # there are multiple replacements at this time but there isn't
    # yet a clear choice
    "RUSTSEC-2025-0141",
    # quick-xml < 0.41.0 two DoS advisories: unbounded namespace-declaration
    # allocation in NsReader (0195) and quadratic-time attribute duplicate check
    # (0194). Pulled in transitively at two versions with no upgrade path yet:
    # object_store (latest 0.14.0) pins quick-xml ^0.40.1 and inferno (latest
    # 0.12.6, via pprof) pins ^0.39 — neither reaches the patched 0.41.0. Remove
    # once object_store and pprof/inferno move to quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustls-webpki 0.102.8 CRL distribution point matching bug; low impact
    # (requires CA compromise). Stuck on 0.102.x via wasmtime's rustls 0.22.x
    # dep in datafusion-udf-wasm. Upstream also ignores this advisory.
    "RUSTSEC-2026-0049",
    # rustls-webpki 0.102.8 wildcard name-constraint bug; stuck on 0.102.x via
    # wasmtime's rustls 0.22.x dep in datafusion-udf-wasm. Upstream fix pulls in
    # newer DataFusion/wasmtime and is not yet compatible with this repo.
    "RUSTSEC-2026-0099",
    # rustls-webpki 0.102.8 URI name-constraint bug; same transitive 0.102.x path
    # via datafusion-udf-wasm/wasmtime/rustls 0.22.x, with the same current
    # incompatibility on the available upstream fix path.
    "RUSTSEC-2026-0098",
    # rustls-webpki CRL parsing reachable panic; only 0.103.13+ and 0.104.0-alpha.7+
    # ship the fix. The 0.103.x transitive is patched via the Cargo.toml pin bump,
    # but the 0.102.x transitive is still stuck via datafusion-udf-wasm/wasmtime/
    # rustls 0.22.x with no patched 0.102.x release available. We don't configure
    # CRLs anywhere in this repo, so the panic is unreachable in practice on that
    # remaining 0.102.x path.
    "RUSTSEC-2026-0104",
    # rustls 0.22.4 advisories with no fix on the 0.22.x line. It comes in only
    # through wasmtime-wasi-http via datafusion-udf-wasm, and Wasm UDFs are
    # disabled by default (udfs_enabled = false). rustls 0.23.x is updated to
    # 0.23.46, which fixes both. main no longer has rustls 0.22.
    "RUSTSEC-2026-0346", # Debug impls for client session values expose TLS secrets
    "RUSTSEC-2026-0349", # unauthenticated ServerHello can downgrade later key exchange
    # Wasmtime advisories published on 2026-09-29. Wasmtime 48.0.3 fixes them, but we stay on 48.0.1.
    # The Enterprise build cannot use 48.0.3 yet (see ent/deny.toml), so we handle these advisories the same way in both workspaces.
    # 0313: The UDF Python guest (datafusion-udf-wasm commit 171fb47) gives Python code only `blocking_write_and_flush` for HTTP bodies, and the host rejects calls over 4096 bytes. UDFs are off by default.
    # 0314: The UDF host's file system rejects time changes.
    # 0315: The UDF host does not turn on fuel.
    # 0316: The UDF host does not use `component::Val`.
    # Wasmtime advisories published on 2026-10-02. Wasmtime 48.0.4 fixes them, but we stay on 48.0.1.
    # The Enterprise build cannot use 48.0.4 yet for the same reason (see ent/deny.toml), so we handle these advisories the same way in both workspaces.
    # 0320: The panic is in `default_send_request`. The UDF host uses its own `send_request` instead, and the Python guest does not import `set-between-bytes-timeout`.
    # 0321: The UDF host does not link WASI preview 0 and does not turn on fuel.
    # 0322: The UDF host does not set stdout, so wasmtime uses its sink stream, which has the bug. But the Python guest does not import `write-zeroes` or `blocking-write-zeroes-and-flush`, so it cannot reach it.
    # 0323: The UDF host does not link WASIp1, which holds `fd_readdir`. The Python guest uses WASIp2.
    # 0324: The UDF host does not link WASIp3, and its file system rejects time changes.
    # 0325: This build does not turn on the wasmtime `gc` Cargo feature, so exceptions are off. The Python guest uses no tags.
    # 0326: Without the `gc` Cargo feature, wasmtime has no GC references and no exceptions. The Python guest uses neither.
    # 0327: This build does not turn on the wasmtime `component-model-async` Cargo feature, so async-lifted exports are off. The Python guest has none.
    # Remove these entries when ent/deny.toml removes them.
    "RUSTSEC-2026-0313",
    "RUSTSEC-2026-0314",
    "RUSTSEC-2026-0315",
    "RUSTSEC-2026-0316",
    "RUSTSEC-2026-0320",
    "RUSTSEC-2026-0321",
    "RUSTSEC-2026-0322",
    "RUSTSEC-2026-0323",
    "RUSTSEC-2026-0324",
    "RUSTSEC-2026-0325",
    "RUSTSEC-2026-0326",
    "RUSTSEC-2026-0327",

]
git-fetch-with-cli = true

[licenses]
version = 2
unused-allowed-license = "warn"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "BSD-4-Clause AND ISC AND MIT AND OpenSSL"
license-files = [
    # https://github.com/briansmith/ring/blob/95948b3977013aed16db92ae32e6b8384496a740/LICENSE
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[sources.allow-org]
github = ["influxdata"]

[bans]
multiple-versions = "allow"
deny = [
    # We are using rustls as the TLS implementation, so we shouldn't be linking
    # in OpenSSL too.
    #
    # If you're hitting this, you might want to take a look at what new
    # dependencies you have introduced and check if there's a way to depend on
    # rustls instead of OpenSSL (tip: check the crate's feature flags).
    { name = "openssl-sys" },
    # We've decided to use the `humantime` crate to parse and generate friendly time formats; use
    # that rather than chrono-english.
    { name = "chrono-english" },
    # Use stdlib ( https://doc.rust-lang.org/stable/std/io/trait.IsTerminal.html )
    { name = "atty" },
]
