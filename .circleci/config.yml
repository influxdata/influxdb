version: 2.1
parameters:
  cross-container-tag:
    # when updating the go version, should also update the go version in go.mod
    description: docker tag for cross build container from quay.io . Created by https://github.com/influxdata/edge/tree/master/dockerfiles/cross-builder .
    type: string
    default: go1.26.5-latest

  workflow:
    type: string
    default: build

  release-ref:
    # Republish support. Set this to an existing release tag (e.g. "v1.13.0")
    # together with 'workflow: republish' to rebuild and publish that tag using
    # this file as it stands on the branch the pipeline is triggered from. Every
    # job checks the tag out before building, so the artifacts are built from
    # the tagged source even though the pipeline itself is branch triggered.
    #
    # That cuts both ways, and only this file comes from the branch: CircleCI
    # reads config.yml from the triggering ref, but checkout_source then
    # detaches to the tag, so every file a job reads off disk is the tag's --
    # .circleci/scripts/get-version, .circleci/packages/,
    # releng/packages/spec/ and scripts/ci/CHANGELOG_frozen.md. Only the
    # commands written inline here carry a branch fix. If a release failed
    # because of a bug in one of those, republishing re-runs the broken tagged
    # copy; that needs a new tag instead.
    #
    # Leave empty for normal tag, push and nightly builds.
    type: string
    default: ""

commands:
  checkout_source:
    description: |
      Check out the source to build: the ref that triggered the pipeline, or
      the release-ref tag when one was supplied.
    steps:
      - checkout
      - run:
          name: Select source ref
          environment:
            RELEASE_REF: << pipeline.parameters.release-ref >>
          command: |
            REF="${RELEASE_REF}"
            if [ -z "${REF}" ] ; then
              exit 0
            fi
            # This parameter names both the ref that gets built and the R2
            # directory that gets published to, and it can be supplied straight
            # from the CircleCI UI without going through releng/republish, so
            # constrain it here too. Major, minor and patch are all required,
            # matching .circleci/scripts/get-version: a tag it does not match
            # produces a "1.x-<short sha>" version instead of a release one.
            if ! echo "${REF}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' ; then
              echo "release-ref '${REF}' is not a release tag" >&2
              exit 1
            fi
            # CircleCI's checkout only fetches the triggering ref, so the tag
            # is not guaranteed to be present in the clone.
            git fetch --force --tags origin
            git checkout --detach "refs/tags/${REF}"
            git --no-pager log -1 --format='republishing %H (%s)'

jobs:
  build_binaries:
    docker:
      - image: quay.io/influxdb/cross-builder:<< pipeline.parameters.cross-container-tag >>
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - checkout_source
      - restore_cache:
          keys:
            # We save the cache from this one, so don't restore a cache with old junk and then save new stuff alongside.
            # Start either with the exact right cache, or completely fresh.
            - influxdb-cache-v2-{{ checksum "go.mod" }}
      - run:
          name: Get InfluxDB Version
          environment:
            RELEASE_REF: << pipeline.parameters.release-ref >>
          command: |
            # After checkout_source, HEAD is the release tag, so get-version
            # derives VERSION from it exactly as it does on a tag build.
            PREFIX=1.x .circleci/scripts/get-version

            # A republish is triggered from a branch, so CIRCLE_SHA1 and
            # CIRCLE_BRANCH describe that branch rather than the release. Stamp
            # the binaries with the tagged commit and an empty branch, which is
            # what a tag triggered pipeline produces.
            #
            # CIRCLE_TAG is exported for consistency, so that anything added to
            # this job later sees the value a tag build would have set. BASH_ENV
            # is per job, so it does not carry to build_packages, sign_packages
            # or the publish jobs; those resolve it themselves.
            if [ -n "${RELEASE_REF}" ] ; then
              # VERSION is re-derived from the requested tag rather than left to
              # get-version, which picks the *highest* release tag pointing at
              # HEAD. That is right for a tag build but wrong here: republishing
              # v1.9.0 from a commit also tagged v1.9.1 would stamp 1.9.1 into
              # binaries that the packager names 1.9.0, because the packager
              # reads CIRCLE_TAG. On a republish the requested tag is
              # authoritative. check_release_tag reports the situation.
              version="${RELEASE_REF#v}"
              rest="${version#*.}"
              {
                printf 'export CIRCLE_SHA1=%s\n' "$(git rev-parse HEAD)"
                printf 'export CIRCLE_TAG=%s\n'  "${RELEASE_REF}"
                printf 'export CIRCLE_BRANCH=\n'
                printf 'export VERSION=%s\n'     "${version}"
                printf 'export MAJOR=%s\n'       "${version%%.*}"
                printf 'export MINOR=%s\n'       "${rest%%.*}"
                printf 'export PATCH=%s\n'       "${rest#*.}"
                printf 'export RELEASE=1\n'
              } >>"${BASH_ENV}"
            fi
      - run:
          name: Build source tarball
          command: |
            set -x

            printf '{
                "version": "%s",
                "branch": "%s",
                "sha": "%s"
            }' "${VERSION}" "${CIRCLE_BRANCH}" "${CIRCLE_SHA1}" >"$(pwd)/.metadata.json"

            #
            # Prebuild the man pages so that consumers of the source tarball don't have to build it themselves.
            (cd man && make build && gzip -9 ./*.1)

            mkdir -p ./tarball
            TARBALL_NAME="./tarball/influxdb-src-${CIRCLE_SHA1}.tar.gz"
            tar --exclude-vcs --exclude './tarball' --transform 'flags=r;s|^|influxdb/|' -vczf "${TARBALL_NAME}" .
      - store_artifacts:
          path: tarball/
      - persist_to_workspace:
          root: .
          paths:
            - tarball
      - run:
          name: Build binaries
          command: |
            mkdir -p ./bins/linux-amd64 \
                     ./bins/linux-arm64 \
                     ./artifacts

            function build() {
              for command in \
                influx \
                influx_inspect \
                influxd
              do
                # tags
                case "${GOOS}" in
                  darwin)
                    tags='netgo,osusergo'
                  ;;
                  linux|windows)
                    tags='netgo,osusergo,static_build'
                  ;;
                esac

                # buildmode
                case "${GOOS}" in
                  darwin|linux)
                    buildmode='pie'
                    ;;
                  windows)
                    buildmode='exe'
                    ;;
                esac

                # rustlib
                if [[ "${GOOS}" == linux ]] ; then
                  case "${GOARCH}" in
                    amd64)
                      rustlib="$(find_rustlib_path x86_64-unknown-linux-musl)"
                      ;;
                    arm64)
                      rustlib="$(find_rustlib_path aarch64-unknown-linux-musl)"
                      ;;
                  esac
                fi

                # linker flags
                case "${GOOS}" in
                  darwin|windows)
                    ldflags='-s -w'
                    ;;
                  linux)
                    ldflags='-s -w -linkmode=external -extld='"${CC}"' -extldflags "-fno-PIC -static-pie -Wl,-z,stack-size=8388608 -L'"${rustlib}"' -Wl,-lunwind"'
                    ;;
                esac

                # windows requires ".exe" appended to filename
                if [[ "${GOOS}" = windows ]] ; then
                  binary="bins/${GOOS}-${GOARCH}/${command}.exe"
                else
                  binary="bins/${GOOS}-${GOARCH}/${command}"
                fi

                set -x
                go build -tags="${tags}" -buildmode="${buildmode}" \
                  -ldflags="${ldflags:-}
                            -X \"main.version=${VERSION}\"
                            -X \"main.branch=${CIRCLE_BRANCH}\"
                            -X \"main.commit=${CIRCLE_SHA1}\"
                  " \
                  -o "${binary}" \
                  "github.com/influxdata/influxdb/cmd/${command}"
                set +x
              done
            }

            archive() {
              target="artifacts/influxdb_bin_${GOOS}_${GOARCH}-${CIRCLE_SHA1}.tar.gz"
              if [[ "${GOOS}" = windows ]] ; then
                tar -czf "${target}" -C "bins/${GOOS}-${GOARCH}" \
                  influx.exe \
                  influx_inspect.exe \
                  influxd.exe
              else
                tar -czf "${target}" -C "bins/${GOOS}-${GOARCH}" \
                  influx \
                  influx_inspect \
                  influxd
              fi
              md5sum    "${target}" > "${target}.md5"
              sha256sum "${target}" > "${target}.sha256"
            }

            # darwin
            export CC="$(xcc darwin)"
            export CGO_ENABLED=1
            export GOARCH=amd64
            export GOOS=darwin
            build
            archive

            # windows
            export CC="$(xcc windows)"
            export CGO_ENABLED=1
            export GOARCH=amd64
            export GOOS=windows
            build
            archive

            # linux amd64 (static build)
            export CC="$(xcc linux x86_64)"
            export CGO_ENABLED=1
            export GOARCH=amd64
            export GOOS=linux
            build
            archive

            # linux arm64 (static build)
            export CC="$(xcc linux aarch64)"
            export CGO_ENABLED=1
            export GOARCH=arm64
            export GOOS=linux
            build
            archive
      - store_artifacts:
          path: artifacts/
      - persist_to_workspace:
          root: .
          paths:
              - artifacts
      - save_cache:
          key: influxdb-cache-v2-{{ checksum "go.mod" }}
          paths:
            - /go/pkg/mod
            - /root/.cargo
            - /root/.cache/go-build

  build_packages:
    docker:
      - image: us-east1-docker.pkg.dev/influxdata-team-edge/ci-support/ci-packager-next@sha256:725a78cb2990f1bc6962ced0383985588561f1893f90ae1446b120b6f13ee10b
        auth:
          username: _json_key
          password: $CISUPPORT_GCS_AUTHORIZATION
    steps:
      - checkout_source
      - attach_workspace:
          at: /tmp/workspace
      - run:
          environment:
            RELEASE_REF: << pipeline.parameters.release-ref >>
          command: |
            # .circleci/packages/config.yaml derives the package version from
            # CIRCLE_TAG, which is unset on a branch triggered republish.
            export CIRCLE_TAG="${CIRCLE_TAG:-${RELEASE_REF}}"

            ( cd man ; make build ; gzip -9 ./*.1 )

            packager .circleci/packages/config.yaml
      - persist_to_workspace:
          root: .
          paths:
            - packages
      - store_artifacts:
          path: packages

  sign_packages:
    circleci_ip_ranges: true
    docker:
      - image: quay.io/influxdb/rsign:latest
        auth:
          username: $QUAY_RSIGN_USERNAME
          password: $QUAY_RSIGN_PASSWORD
    steps:
      - add_ssh_keys:
          fingerpints:
            - fc:7b:6e:a6:38:7c:63:5a:13:be:cb:bb:fa:33:b3:3c
      - attach_workspace:
          at: /tmp/workspace
      - run:
          environment:
            RELEASE_REF: << pipeline.parameters.release-ref >>
          command: |
            # Names the digests file below. Unset on a branch triggered republish,
            # where it would silently produce "influxdb..digests".
            export CIRCLE_TAG="${CIRCLE_TAG:-${RELEASE_REF}}"

            for target in /tmp/workspace/packages/*
            do
              case "${target}"
              in
                # rsign is shipped on Alpine Linux which uses "busybox ash" instead
                # of bash. ash is somewhat more posix compliant and is missing some
                # extensions and niceties from bash.
                *.deb|*.rpm|*.tar.gz|*.zip)
                  rsign "${target}"
                ;;
              esac

              if [ -f "${target}" ]
              then
                # Since all artifacts are present, sign them here. This saves Circle
                # credits over spinning up another instance just to separate out the
                # checksum job.
                sha256sum "${target}" >> "/tmp/workspace/packages/influxdb.${CIRCLE_TAG}.digests"

                md5sum    "${target}" >"${target}.md5"
                sha256sum "${target}" >"${target}.sha256"
              fi
            done
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - packages
      - store_artifacts:
          path: /tmp/workspace/packages

  test_pkgs_64bit:
    machine:
      enabled: true
      docker_layer_caching: true
      image: ubuntu-2204:current
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - checkout_source
      - run:
          name: Test 64 bit packages install
          command: |
            set -x
            export WORKING_DIR=$(pwd)
            # Using subshells with find to get full path of real package files, rather than predicting or hardcoding
            # The glob pattern with -prune causes find to only return files rooted in packages,
            # thereby avoiding files whose names would match, but are in subdirectories, i.e. packages/static.
            "${WORKING_DIR}/releng/packages/spec/clean_install/run.bash" -D \
              -p "$(find "/tmp/workspace/packages"/* -prune -name 'influxdb*amd64.deb')"

            "${WORKING_DIR}/releng/packages/spec/clean_install/run.bash" -R \
              -p "$(find "/tmp/workspace/packages"/* -prune -name 'influxdb*x86_64.rpm')"

  static_code_checks:
    docker:
      - image: quay.io/influxdb/cross-builder:<< pipeline.parameters.cross-container-tag >>
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - checkout_source
      - run: ./checkfmt.sh
      - run: ./generate.sh
      - run: go vet ./...

  unit_test:
    docker:
      - image: quay.io/influxdb/cross-builder:<< pipeline.parameters.cross-container-tag >>
    resource_class: xlarge
    parameters:
      data:
        type: string
        default: inmem
      race:
        type: boolean
        default: false
    environment:
      INFLUXDB_DATA_INDEX_VERSION: << parameters.data >>
      GORACE: halt_on_error=1
    steps:
      - checkout_source
      - restore_cache:
          keys:
            - influxdb-cache-v2-{{ checksum "go.mod" }}
            - influxdb-cache-v2
      - when:
          condition: << parameters.race >>
          steps:
            - run:
                name: Execute Tests
                command: |
                  mkdir -p junit-race-<< parameters.data >>
                  # "resource_class: xlarge" creates a Docker container with eight
                  # virtual cpu cores. However, applications like "nproc" return
                  # the host machine's core count (which in this case is 36).
                  # When less cores are available than advertised, the tests
                  # sometimes fail.
                  #
                  # We'll manually reduce the number of available cores to what
                  # is specified by the CircleCI documentation:
                  # https://circleci.com/product/features/resource-classes/
                  taskset -c 0-7 \
                    gotestsum \
                      --format=standard-verbose \
                      --junitfile=junit-race-<< parameters.data >>/influxdb.junit.xml \
                      -- -race ./...
            - store_test_results:
                path: junit-race-<< parameters.data >>/
      - when:
          condition: { not: << parameters.race >> }
          steps:
            - run:
                name: Execute Tests
                command: |
                    mkdir -p junit-<< parameters.data >>
                    # "resource_class: xlarge" creates a Docker container with eight
                    # virtual cpu cores. However, applications like "nproc" return
                    # the host machine's core count (which in this case is 36).
                    # When less cores are available than advertised, the tests
                    # sometimes fail.
                    #
                    # We'll manually reduce the number of available cores to what
                    # is specified by the CircleCI documentation:
                    # https://circleci.com/product/features/resource-classes/
                    taskset -c 0-7 \
                      gotestsum \
                        --format=standard-verbose \
                        --junitfile=junit-<< parameters.data >>/influxdb.junit.xml \
                        -- ./...
            - store_test_results:
                path: junit-<< parameters.data >>/

  fluxtest:
    docker:
      - image: quay.io/influxdb/cross-builder:<< pipeline.parameters.cross-container-tag >>
    steps:
      - checkout_source
      - run:
          name: Execute test
          command: ./test-flux.sh || exit 1
          no_output_timeout: 1500s

  check_release_tag:
    docker:
      - image: cimg/base:current
    steps:
      - checkout_source
      - run:
          name: Check for sibling release tags
          environment:
            RELEASE_REF: << pipeline.parameters.release-ref >>
          command: |
            if [ -z "${RELEASE_REF}" ] ; then
              echo 'no release-ref; nothing to check'
              exit 0
            fi

            # A commit carrying more than one release tag usually means the
            # newer tag supersedes the older, so republishing the older one is
            # rarely what was intended. build_binaries pins VERSION from
            # release-ref so the artifacts are at least self consistent; this
            # job exists to put the situation in front of whoever approves
            # hold_publish. It is a leaf: nothing requires it, so a failure
            # here reports without blocking.
            siblings=''
            for tag in $(git tag --points-at HEAD)
            do
              [ "${tag}" = "${RELEASE_REF}" ] && continue
              echo "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || continue
              siblings="${siblings} ${tag}"
            done

            if [ -n "${siblings}" ] ; then
              echo "The commit behind ${RELEASE_REF} also carries:${siblings}"
              echo
              echo "Republishing ${RELEASE_REF} will publish artifacts that a"
              echo "newer tag on the same commit supersedes. If that is"
              echo "intended, approve hold_publish as usual; this job does not"
              echo "block it. If not, cancel the workflow and republish the"
              echo "newer tag instead."
              exit 1
            fi

            echo "${RELEASE_REF} is the only release tag on this commit"

  changelog:
    docker:
      - image: quay.io/influxdb/changelogger:d7093c409adedd8837ef51fa84be0d0f8319177a
    steps:
      - checkout_source
      - run:
          name: Generate Changelog
          environment:
            RELEASE_REF: << pipeline.parameters.release-ref >>
          command: |
            # A republish is triggered from a branch, so CIRCLE_BRANCH and
            # CIRCLE_SHA1 describe that branch rather than the release, and
            # changelogger writes both into the CHANGELOG's first line. After
            # checkout_source, HEAD is the release tag, so stamp the tagged
            # commit and an empty branch, which is what a tag triggered
            # pipeline produces. Everything below that line is generated from
            # HEAD and so already matches.
            #
            # 'nightly' also runs this job, and leaves release-ref empty: its
            # header names the nightly's branch, as it should.
            if [ -n "${RELEASE_REF}" ] ; then
              export CIRCLE_BRANCH=
              CIRCLE_SHA1="$(git rev-parse HEAD)"
              export CIRCLE_SHA1
            fi

            PRODUCT=OSS changelogger
      - store_artifacts:
          path: changelog_artifacts/
      - persist_to_workspace:
          root: .
          paths:
            - changelog_artifacts

  publish_changelog:
    parameters:
      workflow:
        type: string
    docker:
      - image: cimg/python:3.6
    environment:
      # Newer awscli/boto3 send CRC32 checksum headers that Cloudflare R2
      # rejects unless checksum calculation is limited to when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Install AWS CLI
          command: |
            pip install awscli
      - when:
          condition:
            equal: [ << parameters.workflow >>, release ]
          steps:
            - run:
                name: Upload CHANGELOG to R2
                environment:
                  RELEASE_REF: << pipeline.parameters.release-ref >>
                command: |
                  TAG="${CIRCLE_TAG:-${RELEASE_REF}}"
                  if [ -z "${TAG}" ] ; then
                    echo 'no release tag resolved; refusing to upload' >&2
                    exit 1
                  fi
                  export AWS_ACCESS_KEY_ID="${RELEASE_AWS_ACCESS_KEY_ID}"
                  export AWS_SECRET_ACCESS_KEY="${RELEASE_AWS_SECRET_ACCESS_KEY}"
                  aws s3 cp /tmp/workspace/changelog_artifacts/CHANGELOG.md "s3://dl-influxdata-com/influxdb/releases/${TAG}/CHANGELOG.${TAG}.md" \
                    --endpoint-url "${AWS_ENDPOINT_URL_S3}" \
                    --region auto
      - when:
          condition:
            equal: [ << parameters.workflow >>, nightly ]
          steps:
            - run:
                name: Upload CHANGELOG to R2
                command: |
                  export AWS_ACCESS_KEY_ID="${RELEASE_AWS_ACCESS_KEY_ID}"
                  export AWS_SECRET_ACCESS_KEY="${RELEASE_AWS_SECRET_ACCESS_KEY}"
                  aws s3 cp /tmp/workspace/changelog_artifacts/CHANGELOG.md "s3://dl-influxdata-com/influxdb/nightlies/<< pipeline.git.branch >>/CHANGELOG.md" \
                    --endpoint-url "${AWS_ENDPOINT_URL_S3}" \
                    --region auto

  publish_packages:
    docker:
      - image: cimg/python:3.6
    environment:
      # Newer awscli/boto3 send CRC32 checksum headers that Cloudflare R2
      # rejects unless checksum calculation is limited to when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Install AWS CLI
          command: |
            pip install awscli
      - run:
          name: Upload packages to R2
          environment:
            RELEASE_REF: << pipeline.parameters.release-ref >>
          command: |
            TAG="${CIRCLE_TAG:-${RELEASE_REF}}"
            # An empty tag would sync every package into the top of
            # influxdb/releases/, so fail closed rather than make a mess.
            if [ -z "${TAG}" ] ; then
              echo 'no release tag resolved; refusing to sync' >&2
              exit 1
            fi
            export AWS_ACCESS_KEY_ID="${RELEASE_AWS_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${RELEASE_AWS_SECRET_ACCESS_KEY}"
            aws s3 sync /tmp/workspace/packages "s3://dl-influxdata-com/influxdb/releases/${TAG}" \
              --endpoint-url "${AWS_ENDPOINT_URL_S3}" \
              --region auto
  slack:
    docker:
      - image: us-east1-docker.pkg.dev/influxdata-team-edge/ci-support/ci-slack:latest
        auth:
          username: _json_key
          password: $CISUPPORT_GCS_AUTHORIZATION
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          command: |
            export CIRCLE_TAG="${CIRCLE_TAG:-${RELEASE_REF}}"
            slack
          environment:
            RELEASE_REF:                << pipeline.parameters.release-ref >>
            SLACK_ARTIFACT_URL:         https://dl.influxdata.com/influxdb/releases
            SLACK_ARTIFACT_ROOT:        /tmp/workspace/packages
            SLACK_ARTIFACT_EXCLUDE_DIR: race
            SLACK_RELEASE_MESSAGE:      New InfluxDB Release

release_filter: &release_filter
  filters:
    tags:
      # This regex matches what is found in 'scripts/get-version' with the
      # '[[:digit:]]' transformed into '\d'. This also excludes release
      # candidate detection, because this filter only matches against
      # full releases.
      only: /^v(\d+)(?:\.(\d+))?(?:\.(\d+))?$/
    branches:
      ignore: /.*/

workflows:
  version: 2.1
  # Mirrored by the 'republish' workflow below. A job added here, or a
  # dependency changed here, needs the same change there.
  release:
    when:
      equal: [ << pipeline.parameters.workflow >>, build ]
    jobs:
      - build_binaries:
          <<: *release_filter
      - build_packages:
          <<: *release_filter
          requires:
            - build_binaries
      - sign_packages:
          <<: *release_filter
          requires:
            - build_packages
      - test_pkgs_64bit:
          <<: *release_filter
          requires:
            - build_packages
      - changelog:
          <<: *release_filter
      - publish_changelog:
          <<: *release_filter
          workflow: release
          requires:
            - changelog
      - publish_packages:
          <<: *release_filter
          requires:
            - sign_packages
      - slack:
          <<: *release_filter
          requires:
            - publish_packages
      - static_code_checks:
          <<: *release_filter
      - fluxtest:
          <<: *release_filter
      - unit_test:
          <<: *release_filter
          name: unit_test_inmem
          data: inmem
      - unit_test:
          <<: *release_filter
          name: unit_test_tsi1
          data: tsi1
      - unit_test:
          <<: *release_filter
          name: unit_test_race
          race: true
  # Rebuilds and publishes an already-cut release tag whose original release
  # pipeline failed after build_packages. Trigger it against a branch that
  # carries a working publish configuration:
  #
  #   curl -X POST \
  #     https://circleci.com/api/v2/project/gh/influxdata/influxdb/pipeline \
  #     -H "Circle-Token: ${CIRCLE_TOKEN}" \
  #     -H 'Content-Type: application/json' \
  #     -d '{"branch":"1.13","parameters":{"workflow":"republish","release-ref":"v1.13.0"}}'
  #
  # The source is built from release-ref, not from the branch, so the only
  # difference from the original release build is this file. Every other file
  # the jobs read comes from the tag, including the scripts this one invokes;
  # see the release-ref parameter for what that rules out.
  #
  # This workflow mirrors 'release' job for job, with two intended
  # differences: the hold_publish approval gate, and check_release_tag, which
  # only means anything when release-ref selects a tag and so has no place in
  # 'release'. Keep the two in step: the
  # test jobs are leaf nodes here exactly as they are in 'release', and if
  # publishing is ever gated on them it needs gating in both.
  republish:
    when:
      equal: [ << pipeline.parameters.workflow >>, republish ]
    jobs:
      - build_binaries
      - build_packages:
          requires:
            - build_binaries
      - sign_packages:
          requires:
            - build_packages
      - test_pkgs_64bit:
          requires:
            - build_packages
      - changelog
      - check_release_tag
      # One gate covering both publish paths. A changelog is published
      # whenever packages are, so neither should go out without the other and
      # a single approval covers both.
      #
      # This couples publish_packages to changelog, which 'release' does not
      # do: there, a failed changelog job still lets packages publish without
      # one. That is a gap in 'release' rather than a deliberate difference
      # here, and belongs in the same fix as the ungated test jobs.
      - hold_publish:
          type: approval
          requires:
            - sign_packages
            - changelog
      - publish_packages:
          requires:
            - hold_publish
      - publish_changelog:
          workflow: release
          requires:
            - hold_publish
      - slack:
          requires:
            - publish_packages
      - static_code_checks
      - fluxtest
      - unit_test:
          name: unit_test_inmem
          data: inmem
      - unit_test:
          name: unit_test_tsi1
          data: tsi1
      - unit_test:
          name: unit_test_race
          race: true

  on_push:
    when:
      equal: [ << pipeline.parameters.workflow >>, build ]
    jobs:
      - build_binaries
      - build_packages:
          requires:
            - build_binaries
      - test_pkgs_64bit:
          requires:
            - build_packages
      - static_code_checks
      - fluxtest
      - unit_test:
          name: unit_test_inmem
          data: inmem
      - unit_test:
          name: unit_test_tsi1
          data: tsi1
      - unit_test:
          name: unit_test_race
          race: true
  nightly:
    when:
      and:
        # This requires a pipeline trigger with a custom "workflow" parameter
        # set to "nightly". Since we want to trigger this workflow on several
        # branches, we cannot use the trigger name as suggested by the
        # documentation.
        #
        # For more information:
        # https://circleci.com/docs/scheduled-pipelines/
        - equal: [ << pipeline.trigger_source >>, scheduled_pipeline ]
        - equal: [ << pipeline.parameters.workflow >>, nightly ]
    jobs:
      - changelog
      - static_code_checks
      - fluxtest
      - unit_test:
          name: unit_test_inmem
          data: inmem
      - unit_test:
          name: unit_test_tsi1
          data: tsi1
      - unit_test:
          name: unit_test_race
          race: true
      - build_binaries:
          requires:
            - changelog
            - static_code_checks
            - fluxtest
            - unit_test_inmem
            - unit_test_race
            - unit_test_tsi1
      - build_packages:
          requires:
            - build_binaries
      - test_pkgs_64bit:
          requires:
            - build_packages
